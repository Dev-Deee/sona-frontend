# Rendered by the nginx image's envsubst step: ${API_UPSTREAM} defaults to
# http://host.docker.internal:8080 (a backend running on the host, e.g. sona-backend's compose).
# Set API_UPSTREAM=http://backend:8080 when both containers share a Docker network.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted build assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker, manifest and HTML must always be revalidated so updates roll out.
  location ~* ^/(sw\.js|manifest\.json|index\.html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /api {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
}
