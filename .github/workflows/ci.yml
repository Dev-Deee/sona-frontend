name: Frontend CI

# Lint, format check, tests with coverage gate, production build.
# Runs on develop, on every pull request into develop or main, and is reused by the deploy workflow.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npx tsc -b
      - name: Tests (≥ 80% coverage on calculator logic)
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
