# Frontend only. Start the API first with `docker compose up` in sona-backend; nginx in this
# container proxies /api to it on the host.
services:
  frontend:
    build:
      context: .
      args:
        # Empty = same origin; nginx forwards /api to API_UPSTREAM.
        VITE_API_BASE_URL: ''
    ports:
      - '80:80'
    environment:
      API_UPSTREAM: http://host.docker.internal:8080
    extra_hosts:
      # Makes host.docker.internal resolve on Linux (Docker Desktop provides it automatically).
      - 'host.docker.internal:host-gateway'
